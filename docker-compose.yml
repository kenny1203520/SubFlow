name: subflow

services:
  subflow:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${SUBFLOW_IMAGE:-subflow:local}
    restart: unless-stopped
    environment:
      SUBFLOW_HTTP_PORT: ${SUBFLOW_HTTP_PORT:-8080}
      SUBFLOW_ENV: ${SUBFLOW_ENV:-production}
      SUBFLOW_SETTINGS_ENCRYPTION_KEY: ${SUBFLOW_SETTINGS_ENCRYPTION_KEY:-}
    ports:
      - "${SUBFLOW_HTTP_PORT:-8080}:${SUBFLOW_HTTP_PORT:-8080}"
    volumes:
      - pb_data:/app/pb_data
    healthcheck:
      test: ["CMD", "/app/subflow", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 10m

volumes:
  pb_data:
