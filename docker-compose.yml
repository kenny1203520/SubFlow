name: subflow
services:
  web:
    build: ./frontend
    image: subflow
    container_name: subflow
    restart: unless-stopped
    environment:
      - PORT=4173
      - BACKEND_URL=http://backend:3000
    ports:
      - "4173:4173"
    depends_on:
      - backend
    networks:
      - subflow

  backend:
    build: ./backend
    image: subflow_backend
    container_name: subflow_backend
    restart: unless-stopped
    environment:
      - BACKEND_PORT=3000
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/subflow
      - FRONTEND_URL=https://example.com
      - JWT_SECRET=your_jwt_secret_here
      - AUTH_SECRET=your_auth_pepper_secret_here
      - ENABLE_EMAIL_SERVICE=true
      - SMTP_HOST=smtp.example.com
      - SMTP_PORT=587
      - SMTP_USER=your_email@example.com
      - SMTP_PASS=your_password
      - SMTP_SECURE=false
      - SMTP_FROM="SubFlow <no-reply@example.com>"
    #   AUTH_SECRET_FILE: /run/secrets/auth_secret
    #   JWT_SECRET_FILE: /run/secrets/jwt_secret
    #   SMTP_PASS_FILE: /run/secrets/smtp_pass
    # secrets:
    #   - auth_secret
    #   - jwt_secret
    #   - smtp_pass
    depends_on:
      - db
    networks:
      - subflow

  db:
    image: postgres:18
    container_name: subflow_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: subflow
    # ports:
    #   - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql
      - ./backend/db:/docker-entrypoint-initdb.d
    networks:
      - subflow

  adminer:
    image: adminer
    container_name: subflow_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - subflow

# secrets:
#   auth_secret:
#     file: ./backend/secrets/auth_secret
#   jwt_secret:
#     file: ./backend/secrets/jwt_secret
#   smtp_pass:
#     file: ./backend/secrets/smtp_pass

volumes:
  db_data:

networks:
  subflow:
    driver: bridge
