name: subflow

services:
  frontend:
    build: ./frontend
    image: subflow-frontend
    restart: unless-stopped
    ports:
      - "${SUBFLOW_PORT:-4173}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [subflow]

  backend:
    build: ./backend
    image: subflow-backend
    restart: unless-stopped
    environment:
      SUBFLOW_DATA_DRIVER: ${SUBFLOW_DATA_DRIVER:-pocketbase}
      SUBFLOW_ENV: ${SUBFLOW_ENV:-development}
      SUBFLOW_APP_URL: ${SUBFLOW_APP_URL:-http://localhost:4173}
      SUBFLOW_SMTP_HOST: ${SUBFLOW_SMTP_HOST:-}
      SUBFLOW_SMTP_PORT: ${SUBFLOW_SMTP_PORT:-587}
      SUBFLOW_SMTP_USER: ${SUBFLOW_SMTP_USER:-}
      SUBFLOW_SMTP_PASSWORD: ${SUBFLOW_SMTP_PASSWORD:-}
      SUBFLOW_SMTP_FROM: ${SUBFLOW_SMTP_FROM:-}
    volumes:
      - pb_data:/pb/pb_data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8090/api/health"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 15s
    networks: [subflow]

volumes:
  pb_data:

networks:
  subflow:
    driver: bridge
