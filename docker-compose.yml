name: subflow

services:
  web:
    build: ./frontend
    image: subflow-web
    container_name: subflow-web
    restart: unless-stopped
    ports:
      - "4173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - subflow

  backend:
    build:
      context: ./backend
      args:
        PB_VERSION: 0.39.10
    image: subflow-pocketbase
    container_name: subflow-pocketbase
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - pocketbase_data:/pb/pb_data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8090/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - subflow

volumes:
  pocketbase_data:

networks:
  subflow:
    driver: bridge
