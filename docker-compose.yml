name: subflow

services:
  subflow:
    image: ${SUBFLOW_IMAGE:?Set SUBFLOW_IMAGE to a published, versioned SubFlow image}
    restart: unless-stopped
    environment:
      SUBFLOW_HTTP_PORT: ${SUBFLOW_HTTP_PORT:-8080}
      SUBFLOW_ENV: ${SUBFLOW_ENV:-production}
      SUBFLOW_SETTINGS_ENCRYPTION_KEY: ${SUBFLOW_SETTINGS_ENCRYPTION_KEY:?Set SUBFLOW_SETTINGS_ENCRYPTION_KEY to the persistent deployment key}
    ports:
      - "${SUBFLOW_HTTP_PORT:-8080}:${SUBFLOW_HTTP_PORT:-8080}"
    volumes:
      - pb_data:/app/pb_data
    healthcheck:
      test: ["CMD", "/app/subflow", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 10m

volumes:
  pb_data:
    name: subflow_pb_data
