name: subflow
services:
  db:
    image: postgres:18
    container_name: subflow_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: subflow
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql
      - ./backend/db:/docker-entrypoint-initdb.d

  adminer:
    image: adminer
    container_name: subflow_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"

volumes:
  db_data:
