name: Release

# Publishing is driven entirely by version tags. Tag a commit as v1.2.3 and
# push the tag; this builds the single-image runtime, publishes it to GHCR and
# opens the matching GitHub Release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create the GitHub Release
  packages: write # push the image to GHCR

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/subflow

jobs:
  verify:
    name: Verify
    needs: check-tag
    uses: ./.github/workflows/verify.yml

  codeql:
    name: CodeQL
    needs: check-tag
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    uses: ./.github/workflows/codeql.yml

  check-tag:
    name: Validate tag, versions and changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
      - name: Validate release metadata before building
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: node scripts/release/metadata.mjs

  release:
    name: Build and publish
    needs: [verify, check-tag, codeql]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare exact changelog section
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: node scripts/release/metadata.mjs
      - name: Install container browser checks
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # The Dockerfile builds from Docker Hardened Images, which are only
      # pullable by an entitled Docker account.
      - name: Log in to dhi.io for the base images
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Snapshot stable latest before alpha publication
        if: contains(github.ref_name, '-')
        run: node scripts/release/verify.mjs snapshot-latest

      - name: Build candidate for production-container checks
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: subflow:candidate
          cache-from: type=gha

      - name: Verify fresh setup, registration and production SPA/API
        run: node scripts/release/container-smoke.mjs subflow:candidate
      - name: Rehearse Alpha 1–5 data upgrades, restart and backup restore
        run: node scripts/release/upgrade-matrix.mjs subflow:candidate

      - name: Build and push
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Append immutable image reference to release notes
        env:
          RELEASE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo
            echo "### Container image"
            echo
            echo '```'
            echo "docker pull ${IMAGE_NAME}:${version}"
            echo "docker pull ${IMAGE_NAME}@${RELEASE_DIGEST}"
            echo '```'
          } >> .release/notes.md

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: ${{ github.ref_name }}
          body_path: .release/notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true

      - name: Verify registry image, prerelease and changelog outputs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: node scripts/release/verify.mjs

      - name: Retain release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence-${{ github.ref_name }}-${{ github.run_attempt }}
          path: .release/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error

  outcome:
    name: Release outcome
    if: always()
    needs: [check-tag, verify, codeql, release]
    runs-on: ubuntu-latest
    steps:
      - name: Require every publishing stage to succeed
        env:
          CHECK_TAG: ${{ needs.check-tag.result }}
          VERIFY: ${{ needs.verify.result }}
          CODEQL: ${{ needs.codeql.result }}
          RELEASE: ${{ needs.release.result }}
        run: |
          printf '## Release outcome\n\n| Stage | Result |\n| --- | --- |\n| Metadata | %s |\n| Verify | %s |\n| CodeQL | %s |\n| Publish and artifact verification | %s |\n' "$CHECK_TAG" "$VERIFY" "$CODEQL" "$RELEASE" >> "$GITHUB_STEP_SUMMARY"
          test "$CHECK_TAG" = success && test "$VERIFY" = success && test "$CODEQL" = success && test "$RELEASE" = success
