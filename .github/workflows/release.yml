name: Release

# Publishing is driven entirely by version tags. Tag a commit as v1.2.3 and
# push the tag; this builds the single-image runtime, publishes it to GHCR and
# opens the matching GitHub Release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # create the GitHub Release
  packages: write # push the image to GHCR

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/subflow

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/verify.yml

  check-tag:
    name: Check tag matches package.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches frontend/package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./frontend/package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match frontend/package.json version $pkg"
            exit 1
          fi

  release:
    name: Build and publish
    needs: [verify, check-tag]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The Dockerfile builds from Docker Hardened Images, which are only
      # pullable by an entitled Docker account.
      - name: Log in to dhi.io for the base images
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pull this release's section out of CHANGELOG.md so the release notes
      # and the changelog cannot drift apart.
      - name: Extract release notes
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo 'body<<CHANGELOG_EOF'
            awk -v v="## [$version]" 'index($0, v) == 1 {found=1; next} found && /^## \[/ {exit} found {print}' CHANGELOG.md
            echo
            echo "### Container image"
            echo
            echo '```'
            echo "docker pull ${IMAGE_NAME}:${version}"
            echo '```'
            echo CHANGELOG_EOF
          } >> "$GITHUB_OUTPUT"

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
