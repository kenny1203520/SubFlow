name: CI

# The only workflow that runs on every PR and every push to the two
# long-lived branches — release.yml only ever runs at tag-push time, so
# without this, code could reach develop/master with zero automated checks.
on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/verify.yml

  lint-go:
    name: Lint (Go, changed lines only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve diff base
        id: base
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            echo "sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.before }}" ] && git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            echo "sha=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=HEAD~1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # --new-from-rev scopes findings to lines changed since the diff base,
      # so this can be added without a full-repo cleanup pass first.
      # PocketBase 0.40.6 requires Go 1.27. Pin a golangci-lint release
      # built with Go 1.27 or newer; older binaries reject this module's
      # declared Go version before linting starts. The action must be v7+
      # because v6 does not support golangci-lint v2.
      - uses: golangci/golangci-lint-action@db9de0fc1a667e1a49d2291a1a042dff081d78f6 # v9
        with:
          version: v2.15.0
          working-directory: backend
          args: --new-from-rev=${{ steps.base.outputs.sha }}

  lint-frontend:
    name: Lint (frontend, changed files only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Resolve diff base
        id: base
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            echo "sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.before }}" ] && git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            echo "sha=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=HEAD~1" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint changed files
        working-directory: frontend
        run: |
          mapfile -t files < <(git diff --name-only --relative --diff-filter=ACMR "${{ steps.base.outputs.sha }}" -- ':(glob)src/**/*.ts' ':(glob)src/**/*.vue')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed frontend source files to lint."
            exit 0
          fi
          printf '%s\n' "${files[@]}"
          npx eslint "${files[@]}"
