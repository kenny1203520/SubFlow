name: Verify

# Reusable workflow: backend vet/test + coverage + vulnerability scan, then
# frontend install/test/build + coverage + audit. Order matters — backend
# tests run before the frontend build so the tracked development placeholder
# in backend/internal/web/dist stays intact for asset_test.go. Called by
# ci.yml (on every PR/push) and release.yml (on every version tag), so a
# release can never skip the same checks a normal PR would have needed to
# pass.
on:
  workflow_call: {}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Backend vet and tests
        working-directory: backend
        run: |
          go vet ./...
          go test ./... -coverprofile=coverage.out -covermode=atomic

      - name: Backend coverage summary
        working-directory: backend
        run: go tool cover -func=coverage.out | tail -1

      - name: Backend vulnerability scan
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          go-version-file: backend/go.mod
          work-dir: backend

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Release metadata contract tests
        run: node --test scripts/release/metadata.test.mjs scripts/release/publication.test.mjs

      - name: Frontend dependency audit
        working-directory: frontend
        run: npm audit --audit-level=moderate

      - name: Frontend tests
        working-directory: frontend
        run: npm test -- --coverage

      - name: Frontend build
        working-directory: frontend
        run: npm run build

  browsers:
    name: Browsers (${{ matrix.project }})
    runs-on: ubuntu-latest
    # Firefox refuses to start when the container HOME is not owned by its user.
    env:
      HOME: /root
    # Keep browser binaries and fonts identical across runs. Update this image
    # and the version assertion together with the Playwright lockfile entry.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
      options: --init --ipc=host
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, chromium-touch, webkit-touch]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install test dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Check SDK matches the pinned browser runtime
        working-directory: frontend
        run: node -e "require('node:assert/strict').equal(require('@playwright/test/package.json').version, '1.64.1', 'Update the pinned browser image with Playwright')"

      - name: End-to-end browser tests
        working-directory: frontend
        run: npm run test:e2e -- --project=${{ matrix.project }}

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-route-screenshots-${{ github.run_id }}-${{ matrix.project }}
          path: frontend/test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright report and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-${{ github.run_id }}-${{ matrix.project }}
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 14
