name: Verify

# Reusable workflow: backend vet/test + coverage + vulnerability scan, then
# frontend install/test/build + coverage + audit. Order matters — backend
# tests run before the frontend build so the tracked development placeholder
# in backend/internal/web/dist stays intact for asset_test.go. Called by
# ci.yml (on every PR/push) and release.yml (on every version tag), so a
# release can never skip the same checks a normal PR would have needed to
# pass.
on:
  workflow_call: {}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Backend vet and tests
        working-directory: backend
        run: |
          go vet ./...
          go test ./... -coverprofile=coverage.out -covermode=atomic

      - name: Backend coverage summary
        working-directory: backend
        run: go tool cover -func=coverage.out | tail -1

      - name: Backend vulnerability scan
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: backend/go.mod
          work-dir: backend

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend dependency audit
        working-directory: frontend
        # Report-only for now: the current lockfile has pre-existing
        # high-severity transitive advisories that are a separate cleanup
        # task, not something this check should block on until triaged.
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Frontend tests
        working-directory: frontend
        run: npm test -- --coverage

      - name: Frontend build
        working-directory: frontend
        run: npm run build
